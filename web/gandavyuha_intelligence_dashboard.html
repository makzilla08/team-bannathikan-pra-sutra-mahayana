<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaṇḍavyūha Sūtra: Intelligence Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/chapter_index.js"></script>
    <style>
        body { font-family: 'Sarabun', sans-serif; background: linear-gradient(135deg, #1a1c2c 0%, #4a192c 100%); color: white; margin: 0; padding: 20px; min-height: 100vh; }
        .container { max-width: 1000px; margin: auto; background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); padding: 40px; border-radius: 20px; box-shadow: 0 8px 32px 0 rgba(0,0,0,0.37); border: 1px solid rgba(255, 255, 255, 0.18); }
        h1 { text-align: center; color: #ffd700; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); font-size: 2.5em; margin-bottom: 30px; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; margin-bottom: 40px; }
        .stat-card { background: rgba(0, 0, 0, 0.2); padding: 20px; border-radius: 15px; text-align: center; border: 1px solid rgba(255, 215, 0, 0.3); }
        .stat-card h3 { color: #ccc; font-size: 1.1em; margin-bottom: 10px; }
        .stat-card .value { font-size: 2.5em; font-weight: bold; color: #ffd700; }
        .chart-container { background: rgba(255, 255, 255, 0.05); padding: 20px; border-radius: 15px; display: flex; flex-direction: column; align-items: center; }
        .progress-section { margin-top: 20px; }
        .progress-bar-bg { background: rgba(255, 255, 255, 0.1); height: 25px; border-radius: 12.5px; overflow: hidden; margin: 15px 0; }
        .progress-bar-fill { background: linear-gradient(90deg, #ffd700, #ff8c00); height: 100%; width: 0%; transition: width 1s ease-in-out; }
        .list-section { margin-top: 30px; }
        .list-section h2 { color: #ffd700; border-bottom: 2px solid #ffd700; padding-bottom: 10px; }
        .chapter-list { list-style: none; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .chapter-item { background: rgba(255, 255, 255, 0.05); padding: 10px 15px; border-radius: 8px; border-left: 4px solid #ffd700; font-size: 0.9em; }
        .footer { text-align: center; margin-top: 40px; font-size: 0.8em; color: #aaa; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 Gaṇḍavyūha Sūtra Intelligence Dashboard</h1>
        
        <div class="stats-grid">
            <div class="stat-card">
                <h3>Translation Progress</h3>
                <div class="value" id="progress-value">0 / 56</div>
                <div class="progress-section">
                    <div class="progress-bar-bg"><div class="progress-bar-fill" id="progress-fill"></div></div>
                    <p id="progress-percent">0% Completed</p>
                </div>
            </div>
            <div class="chart-container">
                <canvas id="statusChart" width="250" height="250"></canvas>
            </div>
        </div>

        <div class="list-section">
            <h2>📜 Recent Completed Chapters</h2>
            <ul class="chapter-list" id="chapter-list">
                <!-- Chapters will be injected here -->
            </ul>
        </div>

        <div class="footer">
            Generated by Gemini CLI Intelligence Suite | <span id="sync-date">...</span>
        </div>
    </div>

    <script>
        const manifest = typeof CHAPTER_MANIFEST !== 'undefined' ? CHAPTER_MANIFEST : {
            ready_chapters: [],
            total_chapters: 56,
            last_sync: 'N/A'
        };

        const readyCount = manifest.ready_chapters.length;
        const totalCount = manifest.total_chapters;
        const percent = ((readyCount / totalCount) * 100).toFixed(1);

        document.getElementById('progress-value').textContent = `${readyCount} / ${totalCount}`;
        document.getElementById('progress-fill').style.width = `${percent}%`;
        document.getElementById('progress-percent').textContent = `${percent}% Completed`;
        document.getElementById('sync-date').textContent = manifest.last_sync;

        const list = document.getElementById('chapter-list');
        const recentChapters = [...manifest.ready_chapters].reverse().slice(0, 10);
        
        recentChapters.forEach(id => {
            const ch = manifest.chapters[id];
            const li = document.createElement('li');
            li.className = 'chapter-item';
            li.textContent = ch.title || `Chapter ${id}`;
            list.appendChild(li);
        });

        const ctx = document.getElementById('statusChart').getContext('2d');
        new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: ['Completed', 'Pending'],
                datasets: [{
                    data: [readyCount, totalCount - readyCount],
                    backgroundColor: ['#ffd700', 'rgba(255, 255, 255, 0.1)'],
                    borderWidth: 0
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { labels: { color: 'white' } } }
            }
        });
    </script>
</body>
</html>
